{% extends "admin_layout.html" %}{% block admin_content %}<div class="admin-title"><h1>陳情案件</h1><div><a class="filter" href="{{ url_for('admin_cases') }}">全部</a> <a class="filter" href="?status=待處理">待處理</a> <a class="filter" href="?status=處理中">處理中</a> <a class="filter" href="?status=已完成">已完成</a></div></div><div class="admin-card table-scroll"><table><tr><th>編號</th><th>姓名</th><th>電話</th><th>類別</th><th>地點</th><th>狀態</th><th>時間</th></tr>{% for c in rows %}<tr><td><a href="{{ url_for('admin_case_detail',case_id=c.id) }}">#{{ c.id }}</a></td><td>{{ c.name }}</td><td>{{ c.phone }}</td><td>{{ c.category }}</td><td>{{ c.location }}</td><td>{{ c.status }}</td><td>{{ c.created_at }}</td></tr>{% else %}<tr><td colspan="7">尚無案件</td></tr>{% endfor %}</table></div>{% endblock %}
