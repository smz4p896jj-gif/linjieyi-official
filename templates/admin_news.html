{% extends "admin_layout.html" %}{% block admin_content %}<h1>最新消息管理</h1><div class="admin-grid"><form class="admin-card" method="post"><h2>發布消息</h2><label>標題<input name="title" required></label><label>內容<textarea name="content" required></textarea></label><label>圖片網址<input name="image_url" placeholder="可留白"></label><button class="btn btn-primary">發布</button></form><div class="admin-card"><h2>已發布消息</h2>{% for n in rows %}<div class="news-row"><div><strong>{{ n.title }}</strong><small>{{ n.published_at }}</small></div><form method="post" action="{{ url_for('delete_news',news_id=n.id) }}"><button class="danger">刪除</button></form></div>{% else %}<p>目前尚無消息。</p>{% endfor %}</div></div>{% endblock %}
