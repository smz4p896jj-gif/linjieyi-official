{% extends "admin_layout.html" %}{% block admin_content %}<h1>網站內容設定</h1><form class="admin-card settings-form" method="post"><h2>首頁主視覺</h2><label>主標題<input name="hero_title" value="{{ settings.hero_title }}"></label><label>主標語<input name="hero_slogan" value="{{ settings.hero_slogan }}"></label><label>介紹文字<textarea name="hero_text">{{ settings.hero_text }}</textarea></label><h2>聯絡資訊</h2><label>服務電話<input name="phone" value="{{ settings.phone }}"></label><label>LINE<input name="line" value="{{ settings.line }}"></label><label>Facebook<input name="facebook" value="{{ settings.facebook }}"></label><label>服務處地址<input name="address" value="{{ settings.address }}"></label><button class="btn btn-primary">儲存網站設定</button></form>{% endblock %}
