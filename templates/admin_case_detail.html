{% extends "admin_layout.html" %}{% block admin_content %}<h1>案件 #{{ case.id }}</h1><div class="admin-card"><div class="detail-grid"><div><small>姓名</small><strong>{{ case.name }}</strong></div><div><small>電話</small><strong>{{ case.phone }}</strong></div><div><small>類別</small><strong>{{ case.category }}</strong></div><div><small>地點</small><strong>{{ case.location or "未填寫" }}</strong></div><div><small>時間</small><strong>{{ case.created_at }}</strong></div><div><small>狀態</small><strong>{{ case.status }}</strong></div></div><h3>問題說明</h3><div class="message-box">{{ case.message }}</div><form method="post" class="status-form"><label>更新狀態<select name="status"><option {% if case.status=="待處理" %}selected{% endif %}>待處理</option><option {% if case.status=="處理中" %}selected{% endif %}>處理中</option><option {% if case.status=="已完成" %}selected{% endif %}>已完成</option></select></label><button class="btn btn-primary">儲存更新</button></form></div>{% endblock %}
